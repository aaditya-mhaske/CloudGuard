apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudguard
  labels:
    app: cloudguard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudguard
  template:
    metadata:
      labels:
        app: cloudguard
    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: cloudguard
          image: cloudguard:hardened
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: cloudguard
spec:
  type: ClusterIP
  selector:
    app: cloudguard
  ports:
    - port: 80
      targetPort: 5000
